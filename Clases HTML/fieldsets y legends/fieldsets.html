<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fildset y legend (simple)</title>
    <link rel="stylesheet" href="fieldsets.css">
</head>

<body>
    <form>
        <fieldset>
            <legend>Infomacion Basica</legend>
            <input type="text" placeholder="Nombre">
            <input type="text" placeholder="Apellido">
            <input type="number" placeholder="Edad">
        </fieldset>
        <fieldset>
            <legend>Infomacion de Contacto</legend>
            <input type="email" placeholder="Email">
            <input type="text" placeholder="Telefono">
        </fieldset>
    </form>

</body>

</html>

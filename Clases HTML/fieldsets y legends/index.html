<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fildset y legend </title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <form>
        <h2>
            Formulario de contacto
        </h2>
        <fieldset> <!--SIMPLE IMPUTS-->
            <legend> INFORMACION BASICA</legend>
            <div class="form_input">
                <label for="nombre">Nombre completo</label>
                <input type="text" placeholder="Juan Doe" id="nombre">
            </div>
            <div class="form_input">
                <label>Email
                    <input type="email" placeholder="ejemplo@gmail.com">
                </label>
            </div>
            <div class="form_input">
                <label>Asunto
                    <input type="text" placeholder="El asunto de tu mensaje">
                </label>
            </div>
        </fieldset>
        <!--SELECT Y OPTION-->
        <div class="form_input">
            <label>Tipo de usuario
                <select name="type-od-user">
                    <option value="user1">Seguidor/a</option>
                    <option value="user2">Empresa</option>
                    <option value="user3">Otros</option>
                </select>
            </label>
        </div>
        <!--DATALIST Y OPTION-->
        <div class="form_input">
            <label>Referente
                <input list="referente" name="referente">
                <datalist id="referente" name="type-od-user">
                    <option value="una empresa">una empresa del rubro IT</option>
                    <option value="un amigo">Me recomendo un amigo</option>
                    <option value="un familiar">Me recomendo un familiar</option>
                </datalist>
            </label>
        </div>
        <!--TEXTAREA-->
        <div class=" form_input">
            <label>Mensaje
                <textarea rows="8" placeholder=" Deja tu mensaje..."></textarea>
            </label>
        </div>
        <div class="form_input">
            <label>Acepto los terminos y condiciones
                <input type="checkbox" class="checkbox">
            </label>
        </div>
    </form>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Picture, source y media</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <picture>
        <source srcset=" id_win.webp" type="image/webp">
        <source media="(max-width:  400px)" srcset=" id_win-small.jpg">
        <source media="(max-width:  600px)" srcset="id_win-medium.jpg">
        <img src="id_win.jpg">
    </picture>
</body>

</html>
